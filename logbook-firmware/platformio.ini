; PlatformIO project untuk sistem tap-in logbook pengunjung lab
; Board: ESP32-C3 (SuperMini/clone), baca UID lewat MFRC522, connect WiFi eduroam
; (WPA2-Enterprise), kirim HTTP POST ke server lokal.
;
; Riwayat singkat: awalnya target Wemos D1 Mini (ESP8266), diganti ke ESP32-C3 karena
; WPA2-Enterprise di ESP8266 gagal konsisten -- dugaan kuat batasan SDK lama ESP8266
; yang cuma support TLS 1.0. Detail lengkap ada di Sistem-Logbook-Pengunjung-RFID.md.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ; ditambah nanti pas butuh (mis. ArduinoJson kalau payload HTTP dibikin JSON)
