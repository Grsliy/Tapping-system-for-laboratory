; PlatformIO project untuk sistem tap-in logbook pengunjung lab
; Board: ESP32-C3 SuperMini, baca UID lewat MFRC522, connect WiFi UGM-IoT (WPA2-PSK biasa),
; kirim HTTPS POST ke Google Apps Script.
;
; Riwayat singkat:
; - Awalnya target Wemos D1 Mini (ESP8266), diganti ke ESP32-C3 karena WPA2-Enterprise
;   di ESP8266 gagal konsisten -- dugaan kuat batasan SDK lama ESP8266 yang cuma support
;   TLS 1.0.
; - ESP32-C3 (SuperMini/clone) lalu diganti ke ESP32 WROOM karena brownout berulang pas
;   WiFi transmit (regulator daya board SuperMini dikenal pas-pasan).
; - eduroam (WPA2-Enterprise) di ESP32 WROOM tetap gagal konsisten, ditinggalkan --
;   arsitektur pindah ke Google Sheets + Apps Script, WiFi ke UGM-IoT (WPA2-PSK biasa).
; - Kembali ke ESP32-C3 SuperMini: alasan awal pindah ke WROOM sudah tidak relevan (WPA2-PSK
;   tidak punya masalah stabilitas seperti eduroam), brownout kemarin murni soal power
;   supply -- pastikan pakai kabel USB/sumber daya yang memadai kali ini.
; Detail lengkap ada di Dokumen/Sistem-Logbook-Pengunjung-RFID.md.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; ESP32-C3 SuperMini pakai USB native bawaan chip (bukan chip USB-to-UART terpisah
; seperti board DevKitM-1 resminya) -- tanpa flag ini, output Serial tidak ter-routing
; ke port USB-nya sama sekali (Monitor kelihatan kosong total, bahkan boot ROM message
; pun tidak muncul).
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ; ditambah nanti pas butuh (mis. ArduinoJson kalau payload HTTP dibikin JSON)
