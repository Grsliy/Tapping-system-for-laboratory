; PlatformIO project untuk sistem tap-in logbook pengunjung lab
; Board: ESP32 WROOM (DevKit), baca UID lewat MFRC522, connect WiFi eduroam
; (WPA2-Enterprise), kirim HTTP POST ke server lokal.
;
; Riwayat singkat:
; - Awalnya target Wemos D1 Mini (ESP8266), diganti ke ESP32-C3 karena WPA2-Enterprise
;   di ESP8266 gagal konsisten -- dugaan kuat batasan SDK lama ESP8266 yang cuma support
;   TLS 1.0.
; - ESP32-C3 (SuperMini/clone) lalu diganti ke ESP32 WROOM karena brownout berulang pas
;   WiFi transmit (regulator daya board SuperMini dikenal pas-pasan).
; Detail lengkap ada di Sistem-Logbook-Pengunjung-RFID.md.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Verbose logging ESP-IDF -- buat lihat detail tahapan handshake WiFi/EAP yang gagal,
; bukan cuma kode status generik. Turunkan lagi ke default (hapus baris ini) kalau
; sudah tidak dibutuhkan, karena bikin log lebih ramai/flash sedikit lebih besar.
build_flags =
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    ; ditambah nanti pas butuh (mis. ArduinoJson kalau payload HTTP dibikin JSON)
